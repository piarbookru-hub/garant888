<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Бизнес-поддержка</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo_ikonka.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .admin-header {
            background: #16213e;
            padding: 20px 30px;
            border-bottom: 2px solid #3b82f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .admin-header h1 { font-size: 20px; color: #3b82f6; }
        .admin-header a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .admin-header a:hover { color: #3b82f6; }

        /* Login */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .login-box {
            background: #16213e;
            padding: 40px;
            border-radius: 12px;
            width: 380px;
            text-align: center;
        }
        .login-box h2 { margin-bottom: 25px; font-size: 22px; }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            font-family: inherit;
        }
        .login-box input:focus { outline: none; border-color: #3b82f6; }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.3s;
        }
        .login-box button:hover { background: #2563eb; }
        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        /* Editor */
        .editor { display: none; padding: 30px; max-width: 900px; margin: 0 auto; }
        .editor.active { display: block; }

        .section-block {
            background: #16213e;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-block h2 {
            font-size: 16px;
            color: #3b82f6;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .field-group { margin-bottom: 15px; }
        .field-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .field-group input,
        .field-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f3460;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
        }
        .field-group input:focus,
        .field-group textarea:focus { outline: none; border-color: #3b82f6; }
        .field-group textarea { min-height: 60px; }

        .card-block {
            background: #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #1a3a6e;
        }
        .card-block h4 {
            font-size: 13px;
            color: #6ba4ff;
            margin-bottom: 10px;
        }

        .save-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #16213e;
            padding: 15px 30px;
            border-top: 2px solid #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 100;
        }
        .save-bar button {
            padding: 12px 35px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-save { background: #3b82f6; color: #fff; }
        .btn-save:hover { background: #2563eb; }
        .btn-download { background: #22c55e; color: #fff; }
        .btn-download:hover { background: #16a34a; }
        .btn-reset { background: #555; color: #fff; }
        .btn-reset:hover { background: #666; }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #22c55e;
            color: #fff;
            padding: 14px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 200;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #ff6b6b; }

        .hint {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        @media (max-width: 639px) {
            .editor { padding: 15px; }
            .section-block { padding: 15px; }
            .save-bar { padding: 10px 15px; }
            .save-bar button { padding: 10px 20px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="admin-header">
        <h1>🛠 Админ-панель</h1>
        <a href="index.html" target="_blank">← Открыть сайт</a>
    </div>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>Вход в админку</h2>
            <p class="login-error" id="loginError">Неверный пароль</p>
            <input type="password" id="passwordInput" placeholder="Введите пароль" onkeydown="if(event.key==='Enter')login()">
            <button onclick="login()">Войти</button>
            <p style="margin-top:20px;font-size:12px;color:#666;">Пароль по умолчанию: <strong>admin</strong></p>
        </div>
    </div>

    <!-- EDITOR -->
    <div class="editor" id="editor"></div>

    <!-- SAVE BAR -->
    <div class="save-bar" id="saveBar" style="display:none;">
        <button class="btn-reset" onclick="loadContent()">↺ Сбросить</button>
        <button class="btn-save" onclick="saveToLocalStorage()">💾 Сохранить</button>
        <button class="btn-download" onclick="downloadJSON()">⬇ Скачать content.json</button>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
    let contentData = null;
    const ADMIN_PASSWORD = 'admin';

    function login() {
        const pass = document.getElementById('passwordInput').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('editor').classList.add('active');
            document.getElementById('saveBar').style.display = 'flex';
            loadContent();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    async function loadContent() {
        try {
            // Сначала пробуем загрузить из localStorage (если есть сохранённые изменения)
            const saved = localStorage.getItem('siteContent');
            if (saved) {
                contentData = JSON.parse(saved);
            } else {
                const resp = await fetch('content.json');
                contentData = await resp.json();
            }
            renderEditor();
        } catch(e) {
            showToast('Ошибка загрузки: ' + e.message, true);
        }
    }

    function renderEditor() {
        const d = contentData;
        let html = '';

        // HEADER
        html += `<div class="section-block">
            <h2>📌 Шапка сайта</h2>
            <div class="field-group">
                <label>Название компании</label>
                <input type="text" data-path="header.logoText" value="${esc(d.header.logoText)}">
            </div>
            <div class="field-group">
                <label>Email</label>
                <input type="text" data-path="header.email" value="${esc(d.header.email)}">
            </div>
            <div class="field-group">
                <label>Telegram ссылка</label>
                <input type="text" data-path="header.telegram" value="${esc(d.header.telegram)}">
            </div>
        </div>`;

        // HERO
        html += `<div class="section-block">
            <h2>🏠 Главный экран (Hero)</h2>
            <div class="field-group">
                <label>Заголовок (HTML допустим: &lt;span&gt; для выделения синим)</label>
                <textarea data-path="hero.title" rows="3">${esc(d.hero.title)}</textarea>
            </div>
            <div class="field-group">
                <label>Бейджи (через запятую)</label>
                <input type="text" data-path="hero.badges" value="${esc(d.hero.badges.join(' | '))}">
                <p class="hint">Разделитель: | (вертикальная черта)</p>
            </div>
            <div class="field-group">
                <label>Текст кнопки</label>
                <input type="text" data-path="hero.ctaButton" value="${esc(d.hero.ctaButton)}">
            </div>
        </div>`;

        // PRICING
        html += `<div class="section-block">
            <h2>💰 Тарифы</h2>
            <div class="field-group">
                <label>Заголовок секции</label>
                <input type="text" data-path="pricing.title" value="${esc(d.pricing.title)}">
            </div>
            <div class="field-group">
                <label>Подзаголовок</label>
                <input type="text" data-path="pricing.subtitle" value="${esc(d.pricing.subtitle)}">
            </div>
            <div class="field-group">
                <label>Текст кнопки</label>
                <input type="text" data-path="pricing.buttonText" value="${esc(d.pricing.buttonText)}">
            </div>`;
        d.pricing.rows.forEach((row, i) => {
            html += `<div class="card-block">
                <h4>Тариф ${i+1}</h4>
                <div class="field-group">
                    <label>Оборот</label>
                    <input type="text" data-path="pricing.rows[${i}].turnover" value="${esc(row.turnover)}">
                </div>
                <div class="field-group">
                    <label>Ставка</label>
                    <input type="text" data-path="pricing.rows[${i}].rate" value="${esc(row.rate)}">
                </div>
            </div>`;
        });
        html += `</div>`;

        // WHY US
        html += `<div class="section-block">
            <h2>⭐ Почему мы</h2>
            <div class="field-group">
                <label>Заголовок секции</label>
                <input type="text" data-path="whyUs.title" value="${esc(d.whyUs.title)}">
            </div>`;
        d.whyUs.cards.forEach((card, i) => {
            html += `<div class="card-block">
                <h4>Карточка ${i+1}</h4>
                <div class="field-group">
                    <label>Бейдж</label>
                    <input type="text" data-path="whyUs.cards[${i}].badge" value="${esc(card.badge)}">
                </div>
                <div class="field-group">
                    <label>Заголовок</label>
                    <input type="text" data-path="whyUs.cards[${i}].title" value="${esc(card.title)}">
                </div>
                <div class="field-group">
                    <label>Описание</label>
                    <textarea data-path="whyUs.cards[${i}].text" rows="2">${esc(card.text)}</textarea>
                </div>
            </div>`;
        });
        html += `</div>`;

        // QUIZ
        html += `<div class="section-block">
            <h2>📋 Квиз</h2>
            <div class="field-group">
                <label>Заголовок квиза</label>
                <input type="text" data-path="quiz.title" value="${esc(d.quiz.title)}">
            </div>
            <div class="field-group">
                <label>Вопрос шага 1</label>
                <input type="text" data-path="quiz.step1Question" value="${esc(d.quiz.step1Question)}">
            </div>
            <div class="field-group">
                <label>Варианты шага 1 (через |)</label>
                <input type="text" data-path="quiz.step1Options" value="${esc(d.quiz.step1Options.join(' | '))}">
            </div>
            <div class="field-group">
                <label>Вопрос шага 2</label>
                <input type="text" data-path="quiz.step2Question" value="${esc(d.quiz.step2Question)}">
            </div>
            <div class="field-group">
                <label>Варианты шага 2 (через |)</label>
                <input type="text" data-path="quiz.step2Options" value="${esc(d.quiz.step2Options.join(' | '))}">
            </div>
            <div class="field-group">
                <label>Текст кнопки «Отправить»</label>
                <input type="text" data-path="quiz.submitButton" value="${esc(d.quiz.submitButton)}">
            </div>
        </div>`;

        // CHEQUES
        html += `<div class="section-block">
            <h2>🧾 Чеки</h2>
            <div class="field-group">
                <label>Заголовок (HTML допустим)</label>
                <input type="text" data-path="cheques.title" value="${esc(d.cheques.title)}">
            </div>
            <div class="field-group">
                <label>Подзаголовок</label>
                <textarea data-path="cheques.subtitle" rows="2">${esc(d.cheques.subtitle)}</textarea>
            </div>
            <div class="field-group">
                <label>Список преимуществ (через |)</label>
                <textarea data-path="cheques.list" rows="3">${esc(d.cheques.list.join(' | '))}</textarea>
            </div>
            <div class="field-group">
                <label>Текст основной кнопки</label>
                <input type="text" data-path="cheques.buttonPrimary" value="${esc(d.cheques.buttonPrimary)}">
            </div>
            <div class="field-group">
                <label>Текст вторичной кнопки</label>
                <input type="text" data-path="cheques.buttonSecondary" value="${esc(d.cheques.buttonSecondary)}">
            </div>
        </div>`;

        // CTA BOTTOM
        html += `<div class="section-block">
            <h2>📞 Нижний блок (CTA)</h2>
            <div class="field-group">
                <label>Заголовок</label>
                <input type="text" data-path="ctaBottom.title" value="${esc(d.ctaBottom.title)}">
            </div>
            <div class="field-group">
                <label>Подзаголовок</label>
                <input type="text" data-path="ctaBottom.subtitle" value="${esc(d.ctaBottom.subtitle)}">
            </div>
            <div class="field-group">
                <label>Текст синей кнопки</label>
                <input type="text" data-path="ctaBottom.buttonPrimary" value="${esc(d.ctaBottom.buttonPrimary)}">
            </div>
            <div class="field-group">
                <label>Текст кнопки Telegram</label>
                <input type="text" data-path="ctaBottom.buttonSecondary" value="${esc(d.ctaBottom.buttonSecondary)}">
            </div>
        </div>`;

        // POPUP
        html += `<div class="section-block">
            <h2>💬 Popup-форма</h2>
            <div class="field-group">
                <label>Заголовок формы</label>
                <input type="text" data-path="popup.title" value="${esc(d.popup.title)}">
            </div>
            <div class="field-group">
                <label>Текст кнопки отправки</label>
                <input type="text" data-path="popup.submitButton" value="${esc(d.popup.submitButton)}">
            </div>
        </div>`;

        // STYLES
        if (!d.styles) d.styles = {};
        const defaultStyles = {
            heroTitle: { fontSize: '', color: '' },
            heroBadge: { fontSize: '', color: '', borderColor: '' },
            heroCta: { fontSize: '', color: '', bgColor: '' },
            pricingTitle: { fontSize: '', color: '' },
            pricingSubtitle: { fontSize: '', color: '' },
            pricingRow: { fontSize: '', color: '' },
            whyUsTitle: { fontSize: '', color: '' },
            whyUsBadge: { fontSize: '', color: '', borderColor: '' },
            whyUsCardTitle: { fontSize: '', color: '' },
            whyUsCardText: { fontSize: '', color: '' },
            quizTitle: { fontSize: '', color: '' },
            quizQuestion: { fontSize: '', color: '' },
            quizOption: { fontSize: '', color: '', bgColor: '' },
            quizSubmit: { fontSize: '', color: '', bgColor: '' },
            chequesTitle: { fontSize: '', color: '' },
            chequesSubtitle: { fontSize: '', color: '' },
            chequesListItem: { fontSize: '', color: '' },
            ctaTitle: { fontSize: '', color: '' },
            ctaSubtitle: { fontSize: '', color: '' },
            ctaBtnPrimary: { fontSize: '', color: '', bgColor: '' },
            ctaBtnSecondary: { fontSize: '', color: '', borderColor: '' },
            popupTitle: { fontSize: '', color: '' },
            headerLogo: { fontSize: '', color: '' },
            headerCheques: { fontSize: '', color: '', borderColor: '' },
            headerEmail: { fontSize: '', color: '' }
        };
        for (const key in defaultStyles) {
            if (!d.styles[key]) d.styles[key] = defaultStyles[key];
        }

        html += `<div class="section-block">
            <h2>🎨 Оформление — Шапка</h2>
            ${styleBlock('headerLogo', 'Логотип (текст)', d.styles.headerLogo, ['fontSize','color'])}
            ${styleBlock('headerCheques', 'Кнопка «Кассовые чеки»', d.styles.headerCheques, ['fontSize','color','borderColor'])}
            ${styleBlock('headerEmail', 'Email', d.styles.headerEmail, ['fontSize','color'])}
        </div>`;

        html += `<div class="section-block">
            <h2>🎨 Оформление — Главный экран</h2>
            ${styleBlock('heroTitle', 'Заголовок Hero', d.styles.heroTitle, ['fontSize','color'])}
            ${styleBlock('heroBadge', 'Бейджи', d.styles.heroBadge, ['fontSize','color','borderColor'])}
            ${styleBlock('heroCta', 'Кнопка CTA', d.styles.heroCta, ['fontSize','color','bgColor'])}
        </div>`;

        html += `<div class="section-block">
            <h2>🎨 Оформление — Тарифы</h2>
            ${styleBlock('pricingTitle', 'Заголовок секции', d.styles.pricingTitle, ['fontSize','color'])}
            ${styleBlock('pricingSubtitle', 'Подзаголовок', d.styles.pricingSubtitle, ['fontSize','color'])}
            ${styleBlock('pricingRow', 'Строки таблицы', d.styles.pricingRow, ['fontSize','color'])}
        </div>`;

        html += `<div class="section-block">
            <h2>🎨 Оформление — Почему мы</h2>
            ${styleBlock('whyUsTitle', 'Заголовок секции', d.styles.whyUsTitle, ['fontSize','color'])}
            ${styleBlock('whyUsBadge', 'Бейджи карточек', d.styles.whyUsBadge, ['fontSize','color','borderColor'])}
            ${styleBlock('whyUsCardTitle', 'Заголовки карточек', d.styles.whyUsCardTitle, ['fontSize','color'])}
            ${styleBlock('whyUsCardText', 'Текст карточек', d.styles.whyUsCardText, ['fontSize','color'])}
        </div>`;

        html += `<div class="section-block">
            <h2>🎨 Оформление — Квиз</h2>
            ${styleBlock('quizTitle', 'Заголовок квиза', d.styles.quizTitle, ['fontSize','color'])}
            ${styleBlock('quizQuestion', 'Вопросы', d.styles.quizQuestion, ['fontSize','color'])}
            ${styleBlock('quizOption', 'Варианты ответов', d.styles.quizOption, ['fontSize','color','bgColor'])}
            ${styleBlock('quizSubmit', 'Кнопка отправки', d.styles.quizSubmit, ['fontSize','color','bgColor'])}
        </div>`;

        html += `<div class="section-block">
            <h2>🎨 Оформление — Чеки</h2>
            ${styleBlock('chequesTitle', 'Заголовок секции', d.styles.chequesTitle, ['fontSize','color'])}
            ${styleBlock('chequesSubtitle', 'Подзаголовок', d.styles.chequesSubtitle, ['fontSize','color'])}
            ${styleBlock('chequesListItem', 'Пункты списка', d.styles.chequesListItem, ['fontSize','color'])}
        </div>`;

        html += `<div class="section-block">
            <h2>🎨 Оформление — Нижний блок (CTA)</h2>
            ${styleBlock('ctaTitle', 'Заголовок', d.styles.ctaTitle, ['fontSize','color'])}
            ${styleBlock('ctaSubtitle', 'Подзаголовок', d.styles.ctaSubtitle, ['fontSize','color'])}
            ${styleBlock('ctaBtnPrimary', 'Синяя кнопка', d.styles.ctaBtnPrimary, ['fontSize','color','bgColor'])}
            ${styleBlock('ctaBtnSecondary', 'Кнопка-обводка', d.styles.ctaBtnSecondary, ['fontSize','color','borderColor'])}
        </div>`;

        html += `<div class="section-block">
            <h2>🎨 Оформление — Popup</h2>
            ${styleBlock('popupTitle', 'Заголовок формы', d.styles.popupTitle, ['fontSize','color'])}
        </div>`;

        document.getElementById('editor').innerHTML = html;

        // Синхронизация color picker ↔ text input
        document.querySelectorAll('input[type="color"][data-path^="styles."]').forEach(colorInput => {
            const path = colorInput.dataset.path;
            const textInputs = document.querySelectorAll('input[type="text"][data-path="' + path + '"]');
            textInputs.forEach(textInput => {
                colorInput.addEventListener('input', function() {
                    textInput.value = this.value;
                    textInput._userChanged = true;
                });
                textInput.addEventListener('input', function() {
                    if (this.value && /^#[0-9a-fA-F]{6}$/.test(this.value)) {
                        colorInput.value = this.value;
                        colorInput._userChanged = true;
                    }
                });
            });
        });
    }

    function esc(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function styleBlock(key, label, style, fields) {
        const labels = {
            fontSize: 'Размер шрифта (px)',
            color: 'Цвет текста',
            bgColor: 'Цвет фона',
            borderColor: 'Цвет рамки'
        };
        let html = `<div class="card-block" style="padding:12px 15px;">
            <h4 style="margin-bottom:8px;">${label}</h4>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">`;
        fields.forEach(f => {
            const val = (style && style[f]) || '';
            if (f === 'fontSize') {
                html += `<div style="flex:1;min-width:120px;">
                    <label style="font-size:11px;color:#888;">${labels[f]}</label>
                    <input type="number" min="8" max="72" data-path="styles.${key}.${f}" value="${esc(val)}" placeholder="по умолч." style="margin-top:3px;">
                </div>`;
            } else {
                html += `<div style="min-width:100px;">
                    <label style="font-size:11px;color:#888;">${labels[f]}</label>
                    <div style="display:flex;gap:5px;align-items:center;margin-top:3px;">
                        <input type="color" data-path="styles.${key}.${f}" value="${val || '#ffffff'}" style="width:36px;height:36px;padding:2px;cursor:pointer;border:1px solid #333;border-radius:6px;background:#0f3460;">
                        <input type="text" data-path="styles.${key}.${f}" value="${esc(val)}" placeholder="пусто = по умолч." style="flex:1;font-size:12px;">
                    </div>
                </div>`;
            }
        });
        html += `</div></div>`;
        return html;
    }

    function collectData() {
        const d = JSON.parse(JSON.stringify(contentData));
        if (!d.styles) d.styles = {};
        document.querySelectorAll('[data-path]').forEach(el => {
            const path = el.dataset.path;
            let val = el.value;

            // Обработка массивов (разделитель |)
            if (path === 'hero.badges' || path === 'quiz.step1Options' || path === 'quiz.step2Options' || path === 'cheques.list') {
                val = val.split('|').map(s => s.trim()).filter(s => s);
            }

            // Обработка стилей: color picker и text input для одного пути
            if (path.startsWith('styles.')) {
                if (val === '' || val === '#ffffff' || val === '#000000') {
                    // Проверяем: если это color input и значение дефолтное — пропускаем
                    if (el.type === 'color' && !el._userChanged) {
                        // Не перезаписываем текстовое поле
                        return;
                    }
                }
                setByPath(d, path, val);
                return;
            }

            // Устанавливаем значение по пути
            setByPath(d, path, val);
        });
        return d;
    }

    function setByPath(obj, path, value) {
        const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
        let current = obj;
        for (let i = 0; i < parts.length - 1; i++) {
            current = current[parts[i]];
        }
        current[parts[parts.length - 1]] = value;
    }

    function saveToLocalStorage() {
        const data = collectData();
        localStorage.setItem('siteContent', JSON.stringify(data));
        showToast('✅ Изменения сохранены! Обновите главную страницу.');
    }

    function downloadJSON() {
        const data = collectData();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'content.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('✅ Файл content.json скачан. Загрузите его на сервер.');
    }

    function showToast(msg, isError) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => t.className = 'toast', 3000);
    }
    </script>
</body>
